[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "electrolytes"
version = "0.4.10"
license = "GPL-3.0-only"
description = "Electrolyte database manager"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Gabriel S. Gerlero", email = "ggerlero@cimec.unl.edu.ar"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.13,<0.27",
    "pydantic>=2.0.3,<3",
    "pydantic>=2.8.1; python_version >= '3.13'",
    "pydantic>=2.12.1; python_version >= '3.14'",
    "filelock>=3.12.3,<4",
]

[dependency-groups]
lint = ["ruff>=0.16.5,<0.17"]
typing = ["ty>=0.0.76,<0.1"]
test = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]
dev = [
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
]

[project.urls]
Homepage = "https://github.com/microfluidica/electrolytes"
Repository = "https://github.com/microfluidica/electrolytes"

[project.scripts]
electrolytes = "electrolytes.__main__:app"
